<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">KnowFlow architecture</title>
  <desc id="desc">Documents flow through Streamlit and FastAPI into RAG-Anything, LightRAG, DeepSeek, Ollama and local storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.25"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#38bdf8"/></marker>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#f8fafc}.sub{font:15px system-ui,sans-serif;fill:#94a3b8}.box{stroke-width:2;filter:url(#shadow)}
      .head{font:700 19px system-ui,sans-serif;fill:#f8fafc}.body{font:14px system-ui,sans-serif;fill:#cbd5e1}.arrow{stroke:#38bdf8;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .label{font:13px system-ui,sans-serif;fill:#7dd3fc}.pill{font:13px system-ui,sans-serif;fill:#e0f2fe}
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" class="title">KnowFlow 轻量级多模态 RAG</text>
  <text x="600" y="82" text-anchor="middle" class="sub">上传 · 解析 · 多模态索引 · 图谱/向量混合检索 · 可复现评测</text>
  <rect x="50" y="150" width="190" height="150" rx="18" class="box" fill="#1e293b" stroke="#64748b"/>
  <text x="145" y="188" text-anchor="middle" class="head">输入</text><text x="145" y="222" text-anchor="middle" class="body">PDF / Markdown</text>
  <text x="145" y="250" text-anchor="middle" class="body">PNG / JPG</text><text x="145" y="278" text-anchor="middle" class="body">文本 · 图片 · 表格 · 公式</text>
  <rect x="315" y="125" width="220" height="200" rx="18" class="box" fill="#0f766e" stroke="#2dd4bf"/>
  <text x="425" y="166" text-anchor="middle" class="head">应用层</text><text x="425" y="202" text-anchor="middle" class="body">Streamlit 中文页面</text>
  <text x="425" y="230" text-anchor="middle" class="body">FastAPI / OpenAPI</text><text x="425" y="258" text-anchor="middle" class="body">上传校验 · 任务状态</text>
  <text x="425" y="286" text-anchor="middle" class="body">错误脱敏 · 并发限制</text>
  <rect x="610" y="125" width="235" height="200" rx="18" class="box" fill="#3730a3" stroke="#818cf8"/>
  <text x="727" y="166" text-anchor="middle" class="head">RAG 编排</text><text x="727" y="202" text-anchor="middle" class="body">MinerU 文档解析</text>
  <text x="727" y="230" text-anchor="middle" class="body">RAG-Anything 多模态处理</text><text x="727" y="258" text-anchor="middle" class="body">LightRAG mix 检索</text>
  <text x="727" y="286" text-anchor="middle" class="body">向量 + 图谱上下文</text>
  <rect x="920" y="120" width="230" height="96" rx="18" class="box" fill="#7c2d12" stroke="#fb923c"/>
  <text x="1035" y="158" text-anchor="middle" class="head">DeepSeek</text><text x="1035" y="187" text-anchor="middle" class="body">文本生成 / 多模态描述</text>
  <rect x="920" y="242" width="230" height="96" rx="18" class="box" fill="#365314" stroke="#a3e635"/>
  <text x="1035" y="280" text-anchor="middle" class="head">Ollama bge-m3</text><text x="1035" y="309" text-anchor="middle" class="body">本地 1024 维 Embedding</text>
  <path d="M240 225 H300" class="arrow"/><text x="270" y="214" text-anchor="middle" class="label">上传</text>
  <path d="M535 225 H595" class="arrow"/><text x="565" y="214" text-anchor="middle" class="label">调用</text><path d="M845 172 H905" class="arrow"/><path d="M845 278 H905" class="arrow"/>
  <rect x="120" y="430" width="280" height="120" rx="18" class="box" fill="#1e3a8a" stroke="#60a5fa"/>
  <text x="260" y="470" text-anchor="middle" class="head">本地知识库</text><text x="260" y="504" text-anchor="middle" class="body">KV · Vector · Graph · Cache</text>
  <text x="260" y="532" text-anchor="middle" class="body">单 worker / 本地持久化</text>
  <rect x="475" y="430" width="280" height="120" rx="18" class="box" fill="#581c87" stroke="#c084fc"/>
  <text x="615" y="470" text-anchor="middle" class="head">HTTP 回答</text><text x="615" y="504" text-anchor="middle" class="body">答案 · 模式 · 耗时 · 来源</text>
  <text x="615" y="532" text-anchor="middle" class="body">安全错误码 + 请求 ID</text>
  <rect x="830" y="430" width="250" height="120" rx="18" class="box" fill="#713f12" stroke="#facc15"/>
  <text x="955" y="470" text-anchor="middle" class="head">质量保障</text><text x="955" y="504" text-anchor="middle" class="body">470 个自动化测试</text>
  <text x="955" y="532" text-anchor="middle" class="body">16 题 / 32 次真实请求</text>
  <path d="M690 325 C650 370 430 380 300 420" class="arrow"/><path d="M690 325 C675 365 640 390 620 420" class="arrow"/><path d="M750 325 C790 365 900 390 940 420" class="arrow"/>
  <rect x="380" y="594" width="440" height="32" rx="16" fill="#0c4a6e" stroke="#38bdf8"/>
  <text x="600" y="615" text-anchor="middle" class="pill">配置外置 · 密钥不入库 · 指标口径可追溯 · 上游核心低侵入</text>
</svg>
